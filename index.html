<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#169fee" />
  <meta name="description" content="Pesan Bakso Tetelan, Lumpia Beef, minuman, dan catering Kedai Pojok Mba Lutfi via WhatsApp. Ongkir mulai Rp3.000-an." />
  <title>Kedai Pojok Mba Lutfi — Pesan via WhatsApp</title>
  <!-- Perbaikan: Menghapus assets/ dan menyesuaikan nama file di GitHub Anda -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header" id="top">
    <div class="container nav-wrap">
      <a class="brand brand-logo" href="#top">
        <img src="logo-kedai-pojok.png.png" alt="Logo Kedai Pojok" />
      </a>
      <nav class="main-nav">
        <a href="#menu">Menu</a>
        <a href="#cara-pesan">Cara Pesan</a>
        <a href="#info">Info Kedai</a>
      </nav>
      <a class="button button-wa nav-cta" href="https://wa.me/6288212951881" target="_blank">Pesan via WA</a>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container hero-grid">
        <div class="hero-copy">
          <h1>Jajan Enak Gak Pake Mahal, <span>Ongkir Cuma Seharga Parkir!</span></h1>
          <div class="hero-photo-card">
            <img src="menu-header.webp.png" alt="Hero Menu" />
          </div>
        </div>
      </div>
    </section>

    <section id="menu" class="section">
      <div class="container">
        <div class="menu-grid">
          <!-- Menu Lumpia -->
          <article class="menu-card">
            <img src="menu-lumpia.webp.png" alt="Lumpia Beef" />
            <h3>Lumpia Beef</h3>
            <p>Rp15.000/Porsi</p>
          </article>
          <!-- Menu Bakso -->
          <article class="menu-card">
            <img src="menu-bakso-tetelan.webp.png" alt="Bakso Tetelan" />
            <h3>Bakso Sapi Asli Tetelan</h3>
            <p>Rp12.000</p>
          </article>
        </div>
      </div>
    </section>

    <section class="section">
        <div class="process-gallery">
            <img src="lumpia_ingredients.jpg.jpg" alt="Isian" />
            <img src="lumpia_wrap.jpg.jpg" alt="Proses" />
            <img src="lumpia_finished.jpg.jpg" alt="Siap Saji" />
        </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
